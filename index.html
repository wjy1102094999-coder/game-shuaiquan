<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>甩拳生存</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="甩拳生存">
      <canvas id="game" aria-label="游戏画面"></canvas>

      <section class="rotate-notice" aria-hidden="true">
        <div>
          <strong>请横屏游玩</strong>
          <span>旋转手机后继续体验双摇杆操作</span>
        </div>
      </section>

      <section class="hud" aria-live="polite">
        <div class="metric">
          <span id="score">0</span>
          <small>击杀</small>
        </div>
        <div class="metric">
          <span id="wave">1</span>
          <small>波次</small>
        </div>
        <div class="metric">
          <span id="level">1</span>
          <small id="xpText">经验 0/12</small>
        </div>
        <div class="metric">
          <span id="health">3</span>
          <small>生命</small>
        </div>
      </section>

      <button id="restartTop" class="icon-button restart-top" type="button" aria-label="重新开始">
        ↻
      </button>

      <button id="typeButton" class="type-button" type="button" aria-label="选择角色">
        <span id="typeName">均衡</span>
      </button>

      <div id="joystick" class="joystick" aria-label="移动摇杆">
        <div class="joystick-ring"></div>
        <div id="stick" class="joystick-knob"></div>
      </div>

      <div id="aimJoystick" class="joystick aim-joystick" aria-label="转向摇杆">
        <div class="joystick-ring"></div>
        <div id="aimStick" class="joystick-knob"></div>
      </div>

      <section id="upgrade" class="upgrade hidden" aria-live="assertive">
        <div class="upgrade-panel">
          <h2>选择强化</h2>
          <div id="upgradeOptions" class="upgrade-options"></div>
        </div>
      </section>

      <section id="characterSelect" class="character-select hidden" aria-live="assertive">
        <div class="character-panel">
          <header>
            <h2>选择角色</h2>
            <button id="characterClose" type="button" aria-label="关闭">×</button>
          </header>
          <div id="characterOptions" class="character-options"></div>
        </div>
      </section>

      <section id="status" class="status hidden" aria-live="assertive">
        <div class="status-panel">
          <h1>阵亡</h1>
          <p><span id="finalScore">0</span> 击杀</p>
          <button id="restartMain" type="button">再来一局</button>
        </div>
      </section>
    </main>

    <script src="./main.js" defer></script>
  </body>
</html>
